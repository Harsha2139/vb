<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fahrenheit to Celsius ML/DL</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Fahrenheit to Celsius</h1>

        <p class="subtitle">
            Machine Learning and Deep Learning Prediction
        </p>

        <div class="form-group">
            <label for="fahrenheit">Fahrenheit:</label>
            <input type="number" id="fahrenheit" value="212">
        </div>

        <div class="form-group">
            <label for="model">Select Model:</label>

            <select id="model">
                <option value="ml">Machine Learning</option>
                <option value="dl">Deep Learning</option>
            </select>
        </div>

        <button onclick="predict()">Predict</button>

        <div class="result">
            <h2 id="result">Result will appear here</h2>
        </div>

    </div>

    <script>
        async function predict() {

            const fahrenheit =
                document.getElementById("fahrenheit").value;

            const model =
                document.getElementById("model").value;

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    fahrenheit: fahrenheit,
                    model: model
                })
            });

            const data = await response.json();

            if (data.error) {
                document.getElementById("result").innerHTML =
                    "Error: " + data.error;
                return;
            }

            document.getElementById("result").innerHTML =
                "Model: " + data.model + "<br>" +
                "Fahrenheit: " + data.fahrenheit + "<br>" +
                "Celsius: " + data.celsius.toFixed(2);
        }
    </script>

</body>

</html>
